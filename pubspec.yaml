name: all_organizer
description: Bibliotheque unique : animes, films, series, jeunesse et musique, en local et sur serveur.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.4.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  http: ^1.2.2
  path: ^1.9.0
  path_provider: ^2.1.4
  permission_handler: ^12.0.0
  url_launcher: ^6.3.1
  cached_network_image: ^3.4.1
  media_kit: ^1.1.11
  media_kit_video: ^1.2.5
  media_kit_libs_video: ^1.0.5
  just_audio: ^0.9.42
  audio_service: ^0.18.15

dev_dependencies:
  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.14.1

flutter:
  uses-material-design: true
  assets:
    - assets/logo.png
    - assets/icon.png

# Icones de l'application, generees pendant la compilation
flutter_launcher_icons:
  image_path: "assets/icon.png"
  android: true
  ios: false
  min_sdk_android: 23
  adaptive_icon_background: "#0D0B0B"
  adaptive_icon_foreground: "assets/icon_foreground.png"
